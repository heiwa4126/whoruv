name: Build and Publish to TestPyPI
# 再利用可能なワークフローは現在、PyPIのTrusted Publishing機能ではサポートされていないので
# https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
# こういう書き方はできない

on:
  push:
    tags:
      # Test release tags for TestPyPI validation
      - test-*

concurrency:
  group: publish-testpypi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-testpypi:
    if: github.repository_owner == github.actor
    name: Publish to TestPyPI
    # environment: testpypi
    uses: heiwa4126/reusable-workflows/.github/workflows/publish-testpypi.yml@v0.0.2
    with:
      environment: testpypi
    secrets: inherit
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for Trusted Publishing
      contents: read
