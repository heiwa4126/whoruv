name: Build and Publish to PyPI

on:
  push:
    tags:
      # Regular releases: e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+"
      # # Pre-releases: e.g. v1.2.3rc1, v1.2.3b1, v1.2.3a1 (PEP 440 format)
      # - "v[0-9]+.[0-9]+.[0-9]+(a|b|rc)[0-9]+"

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publish-pypi:
    # 再利用可能なワークフローは現在、PyPIのTrusted Publishing機能ではサポートされていない。
    # https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github
    # そのうえ actions でも変な docker イメージを読もうとするので、
    # こういう書き方しかできない。
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.repository_owner == github.actor
    environment: pypi
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for Trusted Publishing
      contents: read

    steps:
      - name: Build package
        uses: heiwa4126/reusable-workflows/build-uv-package@9d6f143bd41d20ec98f777103d10b78339f4b1d7 # v0.0.2
        with:
          checkout: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
# with:
#   skip-existing: true
